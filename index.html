<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2D5A3D" />
    <title>Moments Packaging Kenya — Packaging Supplies &amp; Custom Packaging, Nairobi</title>
    <meta name="description" content="Buy packaging online in Nairobi — bags, boxes, cups, food containers, mailers and labels. Pay with M-Pesa, get same-day Nairobi delivery, or visit our shop on Ukwala Road." />

    <!-- Open Graph / Twitter Card — site-wide defaults. scripts/prerender-seo.mjs rewrites the
         title/description/OG/Twitter tags per URL in the built dist/ files (and adds a canonical +
         page JSON-LD); RouteSeo.tsx/useSeo keep them right after in-app navigation. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Moments Packaging Kenya" />
    <meta property="og:title" content="Moments Packaging Kenya — Packaging Supplies &amp; Custom Packaging, Nairobi" />
    <meta property="og:description" content="Buy packaging online in Nairobi — bags, boxes, cups, food containers, mailers and labels. Pay with M-Pesa, get same-day Nairobi delivery, or visit our shop on Ukwala Road." />
    <meta property="og:url" content="https://momentspackaging.com/" />
    <meta property="og:image" content="https://momentspackaging.com/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Moments Packaging Kenya — Packaging Supplies &amp; Custom Packaging, Nairobi" />
    <meta name="twitter:description" content="Buy packaging online in Nairobi — bags, boxes, cups, food containers, mailers and labels. Pay with M-Pesa, get same-day Nairobi delivery, or visit our shop on Ukwala Road." />
    <meta name="twitter:image" content="https://momentspackaging.com/og-image.jpg" />

    <!-- Enriched 2026-09-06 with contact/social fields already used elsewhere on the site
         (src/data/products.ts) — a fuller Organization block gives both search engines and AI
         assistants a verifiable phone/social presence to cite alongside the business itself,
         not just a name and address. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Moments Packaging (K) Ltd",
        "alternateName": "Moments Packaging Kenya",
        "url": "https://momentspackaging.com/",
        "logo": "https://momentspackaging.com/favicon.png",
        "image": "https://momentspackaging.com/og-image.jpg",
        "description": "Packaging supplies and custom-branded packaging in Nairobi, Kenya — bags, boxes, cups, food containers, mailers and labels. Order online and pay with M-Pesa for same-day Nairobi delivery, or buy in person at our shop on Ukwala Road, OTC.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Weithaga Building, along Ukwala Road, OTC",
          "addressLocality": "Nairobi",
          "addressRegion": "Nairobi",
          "addressCountry": "KE"
        },
        "email": "info@momentspackaging.com",
        "telephone": "+254119556688",
        "sameAs": [
          "https://instagram.com/moments_packaging",
          "https://tiktok.com/@momentspackaging",
          "https://facebook.com/momentspackaging"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+254119556688",
          "contactType": "customer service",
          "areaServed": "KE",
          "availableLanguage": ["English", "Swahili"]
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded non-blocking (the classic media="print" swap trick) — this stylesheet fetch was a
         render-blocking request on every page load. display=swap in the URL already keeps text
         visible in a fallback font in the meantime, so nothing regresses; the noscript below keeps
         fonts working with JS disabled. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" />
    </noscript>
    <!-- Matches AppSplash's forest background so there's no white flash
         between the raw HTML shell painting and React mounting/taking over. -->
    <style>
      html, body { background: #0d3320; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
