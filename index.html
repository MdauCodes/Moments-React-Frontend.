<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2D5A3D" />
    <title>Moments Packaging Kenya — Custom Paper Packaging</title>
    <meta name="description" content="Custom-branded packaging — bags, boxes, cups, mailers and labels — manufactured in Nairobi. Low MOQ, fast turnaround, nationwide delivery." />

    <!-- Open Graph / Twitter Card — same content on every route since this is a client-rendered
         SPA with no per-route server-side meta; still correct for the business as a whole, and a
         real improvement over having none at all (previously true — og-image.jpg existed as an
         asset but was never referenced anywhere). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Moments Packaging Kenya" />
    <meta property="og:title" content="Moments Packaging Kenya — Custom Paper Packaging" />
    <meta property="og:description" content="Custom-branded packaging — bags, boxes, cups, mailers and labels — manufactured in Nairobi. Low MOQ, fast turnaround, nationwide delivery." />
    <meta property="og:url" content="https://momentspackaging.com/" />
    <meta property="og:image" content="https://momentspackaging.com/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Moments Packaging Kenya — Custom Paper Packaging" />
    <meta name="twitter:description" content="Custom-branded packaging — bags, boxes, cups, mailers and labels — manufactured in Nairobi. Low MOQ, fast turnaround, nationwide delivery." />
    <meta name="twitter:image" content="https://momentspackaging.com/og-image.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Moments Packaging (K) Ltd",
        "url": "https://momentspackaging.com/",
        "logo": "https://momentspackaging.com/favicon.png",
        "image": "https://momentspackaging.com/og-image.jpg",
        "description": "Custom-branded packaging — bags, boxes, cups, mailers and labels — manufactured in Nairobi, Kenya.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Nairobi",
          "addressCountry": "KE"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Matches AppSplash's forest background so there's no white flash
         between the raw HTML shell painting and React mounting/taking over. -->
    <style>
      html, body { background: #0d3320; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
